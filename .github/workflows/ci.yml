########################################################
# SAFCO FINTECH LMS - Frontend CI (Pull Requests only)
#
# Runs on PRs targeting main/develop. Main branch pushes
# are gated by the CD workflow's own test job.
########################################################
name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  quality-check:
    name: Lint · Type-check · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: TypeScript type check
        run: npm run type-check

      - name: Next.js production build (smoke test)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://13.62.222.211:8000/api
          NEXT_TELEMETRY_DISABLED: "1"
