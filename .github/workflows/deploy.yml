########################################################
# SAFCO FINTECH LMS - Frontend Continuous Deployment
#
# On push to `main` (or tag v*.*.*):
#   1. Type-check + lint (gate)
#   2. Build sanity check
#   3. Deploy to Vercel
#
# Required repository secrets:
#   VERCEL_TOKEN       - Vercel personal token
#   VERCEL_ORG_ID      - Team or personal org id
#   VERCEL_PROJECT_ID  - Project id from `.vercel/project.json`
########################################################
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  ##########################################
  # 0. Test job — must pass before deploy
  ##########################################
  test:
    name: Type-check · Build (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npm run type-check

      - name: Production build sanity check
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://13.62.222.211:8000/api
          NEXT_TELEMETRY_DISABLED: "1"

  ##########################################
  # 1. Deploy to Vercel (only if tests pass)
  ##########################################
  deploy-vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deploy_url=${URL}" >> $GITHUB_OUTPUT
          echo "Deployed to: ${URL}"

      - name: Smoke-test deployed URL
        run: |
          URL="${{ steps.deploy.outputs.deploy_url }}"
          echo "Waiting 10s for CDN warm-up..."
          sleep 10
          if curl -sfL "${URL}" -o /dev/null; then
            echo "OK: ${URL} responded 2xx."
          else
            echo "!! ${URL} did not respond. Check Vercel deploy logs." >&2
            exit 1
          fi
