########################################################
# SAFCO FINTECH LMS - Frontend DEV (hot reload)
########################################################
version: "3.9"

services:
  frontend-dev:
    image: node:20-alpine
    container_name: safco-frontend-dev
    working_dir: /app
    ports:
      - "3002:3002"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
